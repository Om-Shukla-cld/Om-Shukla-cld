import html
from PIL import Image, ImageOps

PHOTO = "/mnt/user-data/uploads/Screenshot_2025-12-24_155848.png"
RAMP = "@%#*+=-:. "

# ---- Card / box geometry ----
W = 1520
PORTRAIT_W = 660
PORTRAIT_H = 720
PAD = 26
INNER_PAD = 18          # breathing room inside the portrait box
TEXT_X = PORTRAIT_W + 60

FONT = "Consolas, Menlo, monospace"
FS = 15.5
LH = 24

CARD_BG = "#ffffff"
CARD_BORDER = "#e1e4e8"
PORTRAIT_BG = "#ffffff"
KEY_COLOR = "#22863a"
VAL_COLOR = "#0366d6"
HEAD_COLOR = "#24292e"
DOT_COLOR = "#c9d1d9"
MONO_COLOR = "#0f2027"

COLS = 80  # character columns -> controls horizontal resolution


def build_ascii_grid(path, cols):
    img = Image.open(path).convert("L")
    img = ImageOps.autocontrast(img, cutoff=1)
    w, h = img.size
    aspect = h / w
    sample_rows = int(aspect * cols * 0.55)
    small = img.resize((cols, sample_rows))
    px = list(small.getdata())
    lines = []
    for r in range(sample_rows):
        row = px[r * cols:(r + 1) * cols]
        lines.append("".join(RAMP[int(v / 256 * len(RAMP))] for v in row))
    return lines, w / h


def fit_box(target_w, target_h, photo_aspect_wh):
    box_h = target_h
    box_w = box_h * photo_aspect_wh
    if box_w > target_w:
        box_w = target_w
        box_h = box_w / photo_aspect_wh
    return box_w, box_h


def render_portrait_fragment(lines, box_x, box_y, box_w, box_h):
    n_rows = len(lines)
    n_cols = max(len(l) for l in lines)
    line_h = box_h / n_rows
    font_size = line_h / 1.06

    parts = []
    for r, line in enumerate(lines):
        y = box_y + r * line_h + font_size
        parts.append(
            f'<text x="{box_x}" y="{y:.2f}" font-family="{FONT}" '
            f'font-size="{font_size:.2f}" fill="{MONO_COLOR}" '
            f'textLength="{box_w:.2f}" lengthAdjust="spacingAndGlyphs" '
            f'xml:space="preserve">{html.escape(line)}</text>'
        )
    return "\n".join(parts)


def esc(s):
    return html.escape(s)


rows = []
rows.append(("header", "OmShukla"))
rows.append(("kv", "OS", "Linux, Windows"))
rows.append(("kv", "Dev Uptime", "3 years, 6 months"))
rows.append(("kv", "GitHub Uptime", "1 year, 8 months"))
rows.append(("kv", "Host", "Planet Earth (Remote OK)"))
rows.append(("kv", "Kernel", "cloud-native-amd64"))
rows.append(("kv", "IDE", "VS Code, Cursor"))
rows.append(("blank",))
rows.append(("kv", "Languages.Programming", "C++, Python, JavaScript/TypeScript"))
rows.append(("kv", "Languages.Frameworks", "React, Node.js, FastAPI"))
rows.append(("blank",))
rows.append(("kv", "Hobbies", "Competitive Programming, Music"))
rows.append(("kv", "Interests", "Cloud Computing, Open Source Dev"))
rows.append(("blank",))
rows.append(("header", "Contact"))
rows.append(("kv", "Location", "Lucknow, India"))
rows.append(("kv", "Email", "omshukla2028@gmail.com"))
rows.append(("kv", "GitHub", "github.com/om-shukla-cld"))
rows.append(("kv", "LinkedIn", "linkedin.com/in/om-shukla-cld"))
rows.append(("kv", "Portfolio", "om-shukla.dev"))
rows.append(("blank",))
rows.append(("header", "GitHub Stats"))
rows.append(("kv", "Repos", "-- (auto-fills once repo is public)"))
rows.append(("kv", "Stars", "--"))
rows.append(("kv", "Followers", "--"))

max_key_len = max(len(r[1]) for r in rows if r[0] == "kv")
DOT_COL = max_key_len + 2
VAL_COL = DOT_COL + 14

svg_rows = []
y = PAD + FS
for row in rows:
    if row[0] == "header":
        text = row[1]
        dashes = "-" * (48 - (len(text) + 1))
        svg_rows.append(
            f'<text x="{TEXT_X}" y="{y}" font-family="{FONT}" font-size="{FS}" '
            f'font-weight="700" fill="{HEAD_COLOR}" xml:space="preserve">'
            f'{esc(text)} <tspan fill="{DOT_COLOR}">{esc(dashes)}</tspan></text>'
        )
        y += LH
    elif row[0] == "blank":
        y += LH * 0.5
    else:
        _, key, val = row
        n_dots = max(2, DOT_COL - len(key))
        pad_before_val = max(1, VAL_COL - (len(key) + n_dots))
        dots = "." * n_dots
        spacer = " " * pad_before_val
        svg_rows.append(
            f'<text x="{TEXT_X}" y="{y}" font-family="{FONT}" font-size="{FS}" xml:space="preserve">'
            f'<tspan fill="{KEY_COLOR}" font-weight="600">{esc(key)}</tspan>'
            f'<tspan fill="{DOT_COLOR}">{esc(dots)}{esc(spacer)}</tspan>'
            f'<tspan fill="{VAL_COLOR}">{esc(val)}</tspan>'
            f'</text>'
        )
        y += LH

H = max(PORTRAIT_H + PAD * 2, y + PAD)

ascii_lines, photo_aspect = build_ascii_grid(PHOTO, COLS)
target_w = PORTRAIT_W - PAD - INNER_PAD * 2
target_h = PORTRAIT_H - INNER_PAD * 2
box_w, box_h = fit_box(target_w, target_h, photo_aspect)
box_x = PAD + INNER_PAD + (target_w - box_w) / 2
box_y = PAD + INNER_PAD + (target_h - box_h) / 2
portrait_fragment = render_portrait_fragment(ascii_lines, box_x, box_y, box_w, box_h)

svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H:.0f}" viewBox="0 0 {W} {H:.0f}">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="{W}" height="{H:.0f}" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="{W}" height="{H:.0f}" fill="{CARD_BG}"/>
    <rect x="{PAD}" y="{PAD}" width="{PORTRAIT_W - PAD}" height="{PORTRAIT_H}" rx="10" fill="{PORTRAIT_BG}" stroke="{CARD_BORDER}" stroke-width="1.5"/>
    {portrait_fragment}
    {''.join(svg_rows)}
  </g>
  <rect x="0.75" y="0.75" width="{W-1.5}" height="{H-1.5:.0f}" rx="14" fill="none" stroke="{CARD_BORDER}" stroke-width="1.5"/>
</svg>'''

with open("profile_card.svg", "w") as f:
    f.write(svg)

print("wrote profile_card.svg | H:", H, "| portrait box:", box_w, box_h, "| rows:", len(ascii_lines))
